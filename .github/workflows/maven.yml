name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [AUTH-SERVICE, RESUME-SERVICE, RESUME-SECTION-SERVICE, TEMPLATE-SERVICE, AICONTENT-SERVICE, RESUMEAI-GATEWAY, SERVICE-REGISTRY]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file ResumeAI/${{ matrix.service }}/pom.xml
    - name: Run Tests
      run: mvn test --file ResumeAI/${{ matrix.service }}/pom.xml
